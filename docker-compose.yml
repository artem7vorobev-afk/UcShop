version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ucshop1-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ucshop1
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ucshop1-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/ucshop1?schema=public
      - NODE_ENV=production
    depends_on:
      - postgres
    volumes:
      - ./public:/app/public

volumes:
  postgres_data:
